spring:
  datasource:
    url: ${LOAD_DATASOURCE_URL}
    username: ${LOAD_DATASOURCE_USERNAME}
    password: ${LOAD_DATASOURCE_PASSWORD}
  flyway:
    url: ${LOAD_DATASOURCE_URL}
    user: ${LOAD_DATASOURCE_USERNAME}
    password: ${LOAD_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

server:
  tomcat:
    mbeanregistry:
      enabled: true          # actuator에 tomcat.threads.busy(사용 중 요청 스레드 수)를 노출

slack:
  notification:
    enabled: false           # 부하 테스트 중 팀 Slack으로 알림이 가지 않도록

logging:
  level:
    root: WARN               # 인증 필터가 요청마다 찍는 INFO 로그 차단

management:
  endpoints:
    web:
      exposure:
        include: metrics